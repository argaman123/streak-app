<!-- Status badge: top-left. Auto-hides shortly after returning to idle. -->
<div class="status-badge"
     [class.is-local]="status() === 'local'"
     [class.is-saving]="status() === 'saving'"
     [class.is-loading]="status() === 'loading'"
     [class.is-idle]="status() === 'idle'"
     [title]="statusTitle()">
  @switch (status()) {
    @case ('saving')  { <span class="badge-icon spin">↻</span><span class="badge-text">saving…</span> }
    @case ('loading') { <span class="badge-icon spin">↻</span><span class="badge-text">loading…</span> }
    @case ('local')   { <span class="badge-icon">💾</span><span class="badge-text">local only</span> }
    @case ('idle')    { <span class="badge-icon">✓</span><span class="badge-text">saved</span> }
  }
</div>

<div class="shell">
  <router-outlet />
</div>

<nav class="bottom-nav" [class.hidden]="modalOpen()">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
     #navTodayLink (click)="onNavPress(navTodayLink)">
    <span class="nav-emoji">🐸</span>
    <span class="label">{{ T.navToday }}</span>
  </a>
  <a routerLink="/planner" routerLinkActive="active"
     #navPlannerLink (click)="onNavPress(navPlannerLink)">
    <span class="nav-emoji">📒</span>
    <span class="label">{{ T.navPlanner }}</span>
  </a>
  <a routerLink="/history" routerLinkActive="active"
     #navHistoryLink (click)="onNavPress(navHistoryLink)">
    <span class="nav-emoji">🛣️</span>
    <span class="label">{{ T.navHistory }}</span>
  </a>
</nav>
