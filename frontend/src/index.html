<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Streakling 🐸</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6E6">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- "default" (not "black-translucent"): iOS draws the status bar in its
       own area instead of having web content extend underneath it. The
       translucent variant has a long-standing iOS PWA bug where
       env(safe-area-inset-top) reads 0 on cold load until the first user
       scroll / route change, jamming the header under the dynamic island.
       With "default" the status bar lives in iOS's own strip (tinted by
       theme-color below) and our viewport is the clean visible area from
       frame 1 — no env() race. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Streakling">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Caveat:wght@500;700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

</body>
</html>
